services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "bash", "-c", "awslocal sqs list-queues"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - localstack_data:/var/lib/localstack
      - ./docker/localstack/setup-queues.sh:/etc/localstack/init/ready.d/setup-queues.sh

  # Identity Provider (OIDC) — opcional, só sobe com --profile auth
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    profiles:
      - auth

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wagering
      DB_USER: wagering
      DB_PASSWORD: wagering
      SQS_ENDPOINT: http://localstack:4566
      SQS_CONSUMER_ENABLED: "true"
      OUTBOX_PUBLISHER_ENABLED: "true"
      PENDING_REFERENCE_WORKER_ENABLED: "true"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  localstack_data:
